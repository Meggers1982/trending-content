name: Run Beauty Trend Radar

on:
  schedule:
    - cron: '0 13 * * 1'   # Monday ~7am CT (UTC-6) - weekly; edit day/time to change cadence
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-beauty-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run beauty trend radar
        # --skip-reddit: GitHub-hosted runners use cloud/datacenter IPs, which
        # Reddit's anonymous JSON search blocks with an HTTP 403 (confirmed via
        # direct testing) - so cross-checking Reddit here would just be wasted
        # requests and log noise. Google Trends discovery, taxonomy tagging,
        # and opportunity/saturation scoring are unaffected. Manual scans run
        # from the dashboard's "Scan" button don't pass this flag, so they can
        # still pick up Reddit signal from a real workstation's IP.
        run: python google_trend_radar.py --profile beauty --geo US --date "now 7-d" --skip-reddit

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/google_trend_radar
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
          else
            git commit -m "Update beauty trend radar scan"
            git pull --rebase
            git push
          fi
