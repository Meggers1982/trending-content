name: Run Trending Content Pipeline

on:
  schedule:
    - cron: '0 12 * * *'   # 7am CT (UTC-5) / adjust to your timezone
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        required: true
        default: full
        type: choice
        options:
          - full
          - prefetch

permissions:
  contents: write

# The outputs/.pipeline.lock file stops a locally-triggered run from overlapping
# the scheduled one, but it can't stop a manual workflow_dispatch racing the cron
# inside Actions — both would commit the same day's artifacts. Queue instead of
# cancelling: a run that is already part-way through has usually paid for the
# expensive API call.
concurrency:
  group: run-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SERPAPI_TRENDING_NOW_ENABLED: ${{ vars.SERPAPI_TRENDING_NOW_ENABLED || 'true' }}
      SERPAPI_TRENDING_NOW_HOURS: ${{ vars.SERPAPI_TRENDING_NOW_HOURS || '24' }}
      SERPAPI_TRENDING_NOW_CATEGORY_ID: ${{ vars.SERPAPI_TRENDING_NOW_CATEGORY_ID || '7' }}
      SERPAPI_TIMEOUT_SECONDS: ${{ vars.SERPAPI_TIMEOUT_SECONDS || '45' }}
      SERPAPI_MAX_RETRIES: ${{ vars.SERPAPI_MAX_RETRIES || '3' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run radar prefetch
        if: ${{ inputs.mode == 'prefetch' }}
        timeout-minutes: 10
        run: python run_pipeline.py --prefetch-only

      # Healthy runs finish well inside this; the cap makes a hung API call fail
      # fast rather than sit until the job-level timeout.
      - name: Run full pipeline
        if: ${{ inputs.mode == 'full' || github.event_name == 'schedule' }}
        timeout-minutes: 20
        run: python run_pipeline.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/daily_newsroom_dashboard data/run_history.yaml data/deferred_topics.yaml
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
          else
            git commit -m "Update pipeline artifacts"
            git pull --rebase
            git push
          fi

      # Without this a failed daily run is only visible as a red mark in the
      # Actions tab, so the dashboard silently serves yesterday's board.
      - name: Notify on failure
        if: failure()
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$EMAIL_RECIPIENT" ] || [ -z "$EMAIL_SENDER" ]; then
            echo "Resend not configured — skipping failure email."
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg from "$EMAIL_SENDER" \
                  --arg to "$EMAIL_RECIPIENT" \
                  --arg url "$RUN_URL" \
                  '{from: $from, to: [$to],
                    subject: "Trending Content pipeline failed",
                    html: ("The daily run did not complete. <a href=\"" + $url + "\">View the logs</a>.")}')"
