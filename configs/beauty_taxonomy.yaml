# Beauty/wellness taxonomy for tagging trend radar candidates.
# Keyword lists are matched (substring, case-insensitive) against a candidate's
# query text. A candidate can carry tags from more than one list at once
# (e.g. "retinol purging" -> ingredient: retinol, concern: purging).
# Not exhaustive by design — extend these lists as new terms show up in scans
# rather than trying to enumerate every possible ingredient/benefit up front.

ingredients:
  - retinol
  - retinoid
  - niacinamide
  - hyaluronic acid
  - peptides
  - vitamin c
  - vitamin e
  - salicylic acid
  - glycolic acid
  - lactic acid
  - azelaic acid
  - ceramides
  - squalane
  - collagen
  - snail mucin
  - centella
  - bakuchiol
  - zinc oxide
  - benzoyl peroxide
  - hydroquinone
  - biotin
  - minoxidil
  - keratin
  - shea butter
  - argan oil
  - rosehip oil

benefits:
  - anti-aging
  - hydration
  - brightening
  - barrier repair
  - skin barrier
  - exfoliation
  - hair growth
  - hair thickening
  - pore minimizing
  - even skin tone
  - firming
  - plumping
  - glass skin
  - dewy skin
  - clear skin
  - scar fading
  - sun protection
  - moisture retention

concerns:
  - acne
  - breakouts
  - purging
  - irritation
  - fragrance sensitivity
  - dryness
  - redness
  - rosacea
  - eczema
  - dermatitis
  - hair loss
  - hair thinning
  - dandruff
  - clogged pores
  - hyperpigmentation
  - sun damage
  - sensitive skin
  - allergic reaction

# Off-topic collisions: a candidate can match a beauty seed/anchor purely by
# substring while actually being about something else entirely. Confirmed in
# production 2026-08: the "peptides" seed (a skincare ingredient) also
# surfaced "paradigm peptides" and "daniel murphy paradigm peptides case" -
# injectable research-chemical peptides and an apparent legal case, not
# skincare. If a candidate's query contains one of these terms, it's dropped
# as off-topic even though it matched a beauty anchor. Add new terms here as
# they show up in scans rather than hardcoding them in the script.
exclusions:
  - research peptides
  - injectable peptides
  - peptide injection
  - paradigm peptides
  - core peptides
  - bpc-157
  - bpc 157
  - tb-500
  - tb 500
  - lawsuit
  - indicted
  - indictment
  - sentenced
  - criminal case
  - arrested
