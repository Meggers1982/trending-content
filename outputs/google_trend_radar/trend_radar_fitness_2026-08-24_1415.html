<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Trend Radar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --ink: #171717;
    --text: #2b2b2b;
    --muted: #696969;
    --paper: #fbfaf8;
    --surface: #fff;
    --soft: #f1f0ec;
    --line: #dedbd4;
    --red: #cf2f32;
    --green: #1f9d55;
    --amber: #d97706;
    --blue: #2563eb;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  .topbar {
    height: 48px;
    background: #070707;
    color: #f7f7f7;
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-weight: 800;
  }
  .mark {
    width: 18px;
    height: 18px;
    margin-right: 10px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 3px;
  }
  .mark span { background: #f7f7f7; border-radius: 999px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 28px 56px; }
  .masthead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    padding: 8px 0 28px;
  }
  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 31px;
    line-height: 1.1;
    color: var(--ink);
  }
  h1 span { color: var(--red); }
  .dek { margin-top: 10px; color: #555; }
  .run-chip {
    border: 1px solid var(--line);
    background: var(--soft);
    border-radius: 4px;
    padding: 7px 10px;
    color: #555;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    white-space: nowrap;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    margin: 0 0 24px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--red);
    border-radius: 6px;
    padding: 18px 20px;
    min-height: 96px;
  }
  .stat.green { border-top-color: var(--green); }
  .stat.amber { border-top-color: var(--amber); }
  .stat.blue { border-top-color: var(--blue); }
  .stat .value {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 34px;
    line-height: 1;
    color: var(--red);
    font-weight: 700;
  }
  .stat.green .value { color: var(--green); }
  .stat.amber .value { color: var(--amber); }
  .stat.blue .value { color: var(--blue); }
  .stat .label { margin-top: 8px; color: #666; font-weight: 800; font-size: 13px; }
  .insight {
    background: #eff6ff;
    border: 1px solid #b7d4ff;
    border-left: 4px solid var(--blue);
    border-radius: 6px;
    padding: 16px 18px;
    margin: 0 0 24px;
    color: #183052;
  }
  .breakouts { margin: 0 0 24px; }
  .breakout-card {
    border: 1px solid var(--line);
    border-left: 4px solid var(--red);
    border-radius: 6px;
    background: var(--surface);
    padding: 10px 14px;
    margin: 0 0 8px;
  }
  .breakout-card .term {
    display: block;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .breakout-card .headline { font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--ink); }
  .breakout-card .headline a { color: inherit; text-decoration: none; }
  .breakout-card .headline a:hover { text-decoration: underline; }
  .breakout-card .source { color: #666; font-size: 11px; font-weight: 700; margin-left: 6px; }
  .sourced-badge {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .seed-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid #9fc2ff;
    background: #dbeafe;
    color: #1457d9;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 12px;
  }
  .section-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .filter-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: #fff;
    color: #555;
    border-radius: 4px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  .filter-btn.active, .filter-btn:hover {
    border-color: #9fc2ff;
    background: #eff6ff;
    color: #1457d9;
  }
  .table-shell {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  table {
    width: 100%;
    min-width: 1060px;
    border-collapse: collapse;
  }
  th {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    color: #6a6a6a;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-align: left;
    padding: 11px 12px;
  }
  td {
    border-bottom: 1px solid #e7e5e0;
    padding: 12px;
    vertical-align: top;
    font-size: 13px;
  }
  tr.topic-row { cursor: pointer; }
  tr.topic-row:hover td { background: #fcfcfb; }
  .rank {
    color: #777;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 800;
    width: 44px;
  }
  .topic-title { font-weight: 800; color: #202020; }
  .topic-sub { color: #606060; font-size: 12px; margin-top: 4px; }
  .similar-toggle { margin-top: 6px; }
  .similar-toggle summary {
    cursor: pointer;
    list-style: none;
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .similar-toggle summary::-webkit-details-marker { display: none; }
  .similar-toggle summary::before { content: "▸ "; }
  .similar-toggle[open] summary::before { content: "▾ "; }
  .similar-list { margin: 6px 0 0; padding: 0 0 0 4px; list-style: none; }
  .similar-list li {
    padding: 4px 0;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    color: #444;
  }
  .similar-list .badge { transform: scale(0.85); margin-right: 4px; }
  .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 800;
    color: #2b2b2b;
    display: inline-block;
    min-width: 28px;
  }
  .mini-bar {
    display: inline-block;
    width: 62px;
    height: 5px;
    background: #e4e1dc;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
    overflow: hidden;
  }
  .mini-bar span { display: block; height: 100%; border-radius: 10px; }
  .radar span { background: var(--red); }
  .emerge span { background: var(--green); }
  .velocity span { background: var(--blue); }
  .opportunity span { background: var(--amber); }
  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge.breakout { color: #dc2626; background: #fff1f1; border: 1px solid #ffa6a6; }
  .badge.emerging { color: #c26a00; background: #fff8e6; border: 1px solid #f4be4a; }
  .badge.rising { color: #1457d9; background: #eff6ff; border: 1px solid #9fc2ff; }
  .badge.watch { color: #6b7280; background: #f4f4f5; border: 1px solid #d4d4d8; }
  .chip {
    display: inline-flex;
    align-items: center;
    margin: 0 4px 4px 0;
    padding: 2px 7px;
    min-height: 22px;
    border-radius: 4px;
    border: 1px solid #b7d4ff;
    background: #eff6ff;
    color: #1457d9;
    font-size: 11px;
    font-weight: 700;
  }
  .detail-row[hidden] { display: none; }
  .detail-row td {
    background: #fbfbf9;
    padding: 0;
  }
  .detail {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    padding: 16px 20px 18px 56px;
    border-top: 1px solid #eeeae4;
  }
  .detail h4 {
    margin: 0 0 6px;
    color: #606060;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .detail p { margin: 0; font-size: 13px; color: #2c2c2c; }
  .spark {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    align-items: end;
    gap: 2px;
    width: 96px;
    height: 30px;
  }
  .spark span {
    display: block;
    background: #cf2f32;
    min-height: 2px;
    border-radius: 2px 2px 0 0;
  }
  .rejected { margin-top: 28px; }
  .rejected > summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
  }
  .rejected > summary::-webkit-details-marker { display: none; }
  .rejected > summary::before {
    content: "▸";
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    transition: transform .15s ease;
    display: inline-block;
  }
  .rejected[open] > summary::before { transform: rotate(90deg); }
  .rejected > .table-shell { margin-top: 12px; }
  .table-hint { margin: 8px 2px 0; font-size: 12px; color: var(--muted); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  @media (max-width: 820px) {
    .wrap { padding: 24px 16px 44px; }
    .masthead { display: block; }
    .run-chip { display: inline-block; margin-top: 18px; white-space: normal; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .toolbar { align-items: flex-start; flex-direction: column; }
    .filters { justify-content: flex-start; }
    .detail { grid-template-columns: 1fr; padding-left: 20px; }
  }
</style>
</head>

<div class="topbar"><span class="mark"><span></span><span></span><span></span><span></span></span>Google Trend Radar</div>
<main class="wrap">
  <header class="masthead">
    <div>
      <h1><span id="topic-title">Trend</span> Radar</h1>
      <div class="dek" id="dek"></div>
    </div>

  </header>

  <section class="stats" id="stats"></section>

  <section class="insight">

    <div id="method-copy" style="margin-top:10px;"></div>

  <section class="breakouts" id="breakouts-section" hidden>
    <div class="toolbar"><div class="section-title">Real-Time Breakouts — Why Now</div></div>
    <div id="breakouts-list"></div>
  </section>

  <section>
    <div class="toolbar">
      <div class="section-title" id="radar-title">Trend Radar</div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="table-shell">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Trend</th>
            <th>Stage</th>
            <th>Radar</th>
            <th>Signals</th>
          </tr>
        </thead>
        <tbody id="topic-rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No trends cleared the radar threshold.</div>
    </div>
    <p class="table-hint">Click a row for emergence/velocity/opportunity, interest history, seed terms, and confidence.</p>
  </section>

  <details class="rejected" id="rejected-section" hidden>
    <summary class="toolbar"><div class="section-title">Rejected Or Weak Signals</div></summary>
    <div class="table-shell">
      <table>
        <thead><tr><th>Topic</th><th>Reason</th><th>Seed</th></tr></thead>
        <tbody id="rejected-rows"></tbody>
      </table>
    </div>
  </details>
</main>

<script>
function readRadarData() {
  const raw = document.getElementById('radar-json').textContent.trim();
  if (!raw || raw === '__RADAR_' + 'DATA__') {
    return {
      run_date: '',
      generated_at: '',
      topic: 'Topic',
      geo: 'US',
      date_window: 'now 7-d',
      methodology: 'Dashboard template preview.',
      summary: { total_reviewed: 0, total_retained: 0, total_rejected: 0, breakouts: 0, emerging: 0, notes: '' },
      candidates: [],
      rejected: []
    };
  }
  return JSON.parse(raw);
}

const D = readRadarData();
const candidates = Array.isArray(D.candidates) ? D.candidates : [];
const rejected = Array.isArray(D.rejected) ? D.rejected : [];
const summary = D.summary || {};
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]));
const clamp = n => Math.max(0, Math.min(100, Number(n) || 0));
const stageClass = value => ['breakout', 'emerging', 'rising', 'watch'].includes(value) ? value : 'watch';

document.getElementById('topic-title').textContent = D.topic || 'Trend';
document.getElementById('dek').textContent = `${D.geo || 'US'} · ${D.date_window || 'now 7-d'} · ${D.run_date || ''}`;
document.getElementById('run-meta').textContent = `Generated: ${(D.generated_at || '').replace('T', ' ')} | retained ${candidates.length}`;
document.getElementById('method-copy').textContent = `${D.methodology}. ${summary.notes || ''}`;
document.getElementById('radar-title').textContent = `Trend Radar — ${candidates.length} retained`;
document.getElementById('seed-list').innerHTML = (Array.isArray(D.seed_terms) ? D.seed_terms : [])
  .map(seed => `<span class="chip">${esc(seed)}</span>`)
  .join('');

const breakouts = Array.isArray(D.trending_now_context) ? D.trending_now_context : [];
if (breakouts.length) {
  document.getElementById('breakouts-section').hidden = false;
  document.getElementById('breakouts-list').innerHTML = breakouts.map(b => {
    // Only render as a clickable link if it's actually http(s) - external
    // API data shouldn't be trusted enough to drop straight into an href.
    const safeLink = /^https?:\/\//i.test(b.link || '') ? b.link : '';
    const headline = safeLink
      ? `<a href="${esc(safeLink)}" target="_blank" rel="noopener noreferrer">${esc(b.headline)}</a>`
      : esc(b.headline);
    return `<div class="breakout-card">
      <span class="term">${esc(b.query)}</span>
      <div class="headline">${headline}${b.source ? ` <span class="source">— ${esc(b.source)}</span>` : ''}</div>
    </div>`;
  }).join('');
}

// Trending Now terms with a confirmed news story (i.e. present in
// trending_now_context) are a stronger signal than a bare Google Trends
// spike - flag candidates traced back to one of them.
const groundedSeeds = new Set(breakouts.map(b => String(b.query || '').toLowerCase().trim()));
function isGrounded(seedTerms) {
  return (Array.isArray(seedTerms) ? seedTerms : []).some(s => groundedSeeds.has(String(s).toLowerCase().trim()));
}

const statData = [
  { label: 'Signals Reviewed', value: summary.total_reviewed ?? 0, cls: '' },
  { label: 'Retained Trends', value: candidates.length, cls: 'green' },
  { label: 'Breakouts', value: summary.breakouts ?? 0, cls: 'amber' },
  { label: 'Emerging', value: summary.emerging ?? 0, cls: 'blue' },
];
document.getElementById('stats').innerHTML = statData.map(s => `
  <div class="stat ${s.cls}">
    <div class="value">${esc(s.value)}</div>
    <div class="label">${esc(s.label)}</div>
  </div>
`).join('');

const filters = ['All', 'breakout', 'emerging', 'rising', 'watch'];
document.getElementById('filters').innerHTML = filters.map((f, i) =>
  `<button class="filter-btn ${i === 0 ? 'active' : ''}" data-filter="${esc(f)}">${esc(f)}</button>`
).join('');

function scoreCell(value, cls) {
  const score = clamp(value);
  return `<span class="num">${score}</span><span class="mini-bar ${cls}"><span style="width:${score}%"></span></span>`;
}

function sparkline(scores) {
  const vals = Array.isArray(scores) ? scores.slice(-8) : [];
  if (!vals.length) return '<span class="topic-sub">No time series</span>';
  const max = Math.max(...vals, 1);
  return `<div class="spark">${vals.map(v => `<span style="height:${Math.max(2, Math.round((v / max) * 30))}px"></span>`).join('')}</div>`;
}

function chips(values) {
  return (Array.isArray(values) ? values : []).slice(0, 4).map(value => `<span class="chip">${esc(value)}</span>`).join('');
}

function tagChips(tags) {
  const entries = tags && typeof tags === 'object' ? Object.entries(tags) : [];
  if (!entries.length) return '<span class="topic-sub">No tags matched</span>';
  return entries.map(([tagType, terms]) => `<span class="chip">${esc(tagType)}: ${esc((terms || []).join(', '))}</span>`).join(' ');
}

function similarHtml(similar) {
  if (!Array.isArray(similar) || !similar.length) return '';
  const items = similar.map(s => {
    const sStage = stageClass(s.trend_stage);
    return `<li><span class="badge ${esc(sStage)}">${esc(sStage)}</span> ${esc(s.topic)} <span class="num">${esc(s.radar_score)}</span></li>`;
  }).join('');
  return `
    <details class="similar-toggle">
      <summary>+${similar.length} similar phrasing${similar.length > 1 ? 's' : ''}</summary>
      <ul class="similar-list">${items}</ul>
    </details>
  `;
}

function rowHtml(c, i) {
  const stage = stageClass(c.trend_stage);
  const lift = c.rising_label || (Number(c.slope) > 0 ? `+${c.slope}` : String(c.slope ?? 0));
  const sourced = isGrounded(c.seed_terms)
    ? '<span class="sourced-badge" title="Traced to a Trending Now term with a confirmed news story">Sourced</span>'
    : '';
  return `
    <tr class="topic-row" data-stage="${esc(stage)}" data-detail="${i}">
      <td class="rank">${String(c.rank || i + 1).padStart(2, '0')}</td>
      <td>
        <div class="topic-title">${esc(c.topic)}${sourced}</div>
        <div class="topic-sub">${esc(c.why_now || '')}</div>
        ${similarHtml(c.similar)}
      </td>
      <td><span class="badge ${esc(stage)}">${esc(stage)}</span></td>
      <td>${scoreCell(c.radar_score, 'radar')}</td>
      <td>${chips(c.discovery_sources)}</td>
    </tr>
    <tr class="detail-row" data-parent="${i}" hidden>
      <td colspan="5">
        <div class="detail">
          <div><h4>Emergence</h4><p>${scoreCell(c.emergence_score, 'emerge')}</p></div>
          <div><h4>Velocity</h4><p>${scoreCell(c.velocity_score, 'velocity')}</p></div>
          <div><h4>Opportunity</h4><p>${scoreCell(c.opportunity_score, 'opportunity')}</p></div>
          <div><h4>Interest / Lift</h4><p>${sparkline(c.interest_scores)}<span class="num">${esc(lift)}</span></p></div>
          <div><h4>Recommended Action</h4><p>${esc(c.recommended_action || '')}</p></div>
          <div><h4>Seed Terms</h4><p>${esc((c.seed_terms || []).join(', ') || 'None')}</p></div>
          <div><h4>Confidence</h4><p>${esc(c.confidence || 'low')} confidence · score ${esc(c.confidence_score ?? 0)}</p></div>
          <div><h4>Tags</h4><p>${tagChips(c.tags)}</p></div>
        </div>
      </td>
    </tr>
  `;
}

const tbody = document.getElementById('topic-rows');
tbody.innerHTML = candidates.map(rowHtml).join('');
document.getElementById('empty').hidden = candidates.length > 0;

tbody.addEventListener('click', event => {
  if (event.target.closest('.similar-toggle')) return; // its own <details> handles itself
  const row = event.target.closest('.topic-row');
  if (!row) return;
  const detail = tbody.querySelector(`.detail-row[data-parent="${row.dataset.detail}"]`);
  if (detail) detail.hidden = !detail.hidden;
});

document.getElementById('filters').addEventListener('click', event => {
  const btn = event.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(button => button.classList.remove('active'));
  btn.classList.add('active');
  const filter = btn.dataset.filter;
  document.querySelectorAll('.topic-row').forEach(row => {
    const show = filter === 'All' || row.dataset.stage === filter;
    row.hidden = !show;
    const detail = tbody.querySelector(`.detail-row[data-parent="${row.dataset.detail}"]`);
    if (detail) detail.hidden = true;
  });
});

if (rejected.length) {
  document.getElementById('rejected-section').hidden = false;
  document.getElementById('rejected-rows').innerHTML = rejected.map(r => `
    <tr><td>${esc(r.topic)}</td><td>${esc(r.reason)}</td><td>${esc((r.seed_terms || []).join(', '))}</td></tr>
  `).join('');
}
</script>
