<script>
function readPipelineData() {
  const raw = document.getElementById('pipeline-json').textContent.trim();
  if (!raw || raw === '__PIPELINE_' + 'DATA__') {
    return {
      run_date: '',
      niche: 'Health & Wellness',
      signal_summary: {
        total_reviewed: 0,
        total_retained: 0,
        total_rejected: 0,
        notes: 'This is the dashboard template. Run python run_pipeline.py --no-email to generate a filled dashboard, or open outputs/daily_newsroom_dashboard/dashboard_preview.html to view the design preview.'
      },
      candidates: [],
      rejected: []
    };
  }
  try {
    return JSON.parse(raw);
  } catch (error) {
    return {
      run_date: '',
      niche: 'Health & Wellness',
      signal_summary: {
        total_reviewed: 0,
        total_retained: 0,
        total_rejected: 0,
        notes: `Dashboard data could not be parsed: ${error.message}`
      },
      candidates: [],
      rejected: []
    };
  }
}
const D = readPipelineData();
const candidates = Array.isArray(D.candidates) ? D.candidates : [];
const rejected = Array.isArray(D.rejected) ? D.rejected : [];
const summary = D.signal_summary || {};

const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[ch]));
const clamp = n => Math.max(0, Math.min(100, Number(n) || 0));
const fmtDate = value => value || new Date().toISOString().slice(0, 10);
const urgencyClass = value => {
  if (value === 'now') return 'now';
  if (value === 'today') return 'today';
  if (value === 'this_week') return 'week';
  if (value === 'evergreen') return 'evergreen';
  return 'monitor';
};
const serpClass = c => {
  const avg = ((Number(c.trend_strength_score) || 0) + (Number(c.opportunity_score) || 0)) / 2;
  if (avg >= 82) return 'easy';
  if (avg >= 65) return 'med';
  return 'hard';
};
const serpLabel = cls => ({ easy: 'Easy', med: 'Med', hard: 'Hard' }[cls] || 'Med');
const velocity = c => clamp(Math.round(((Number(c.discover_score) || 0) / 5) * 100));
const sourceLabels = c => {
  const labels = [];
  if (c.signal_type) labels.push(String(c.signal_type).replace(/_/g, ' '));
  if (c.confidence) labels.push(`${c.confidence} conf`);
  if (c.content_status) labels.push(c.content_status);
  return labels.slice(0, 3);
};

document.getElementById('dek').textContent =
  `${esc(D.niche || 'Health & Wellness')} · US · ${fmtDate(D.run_date)} · with Google Trends data`;
document.getElementById('run-meta').textContent =
  `Generated: ${fmtDate(D.run_date)} | retained ${candidates.length} | pipeline v2`;

const p1 = candidates.filter(c => c.priority_level === 'P1').length;
const flags = candidates.filter(c => String(c.notes || '').trim() || c.confidence === 'low').length;
const statData = [
  { label: 'Signals Processed', value: summary.total_reviewed ?? 0, cls: '' },
  { label: 'Retained Topics', value: candidates.length, cls: 'green' },
  { label: 'Publish NOW', value: p1, cls: 'amber' },
  { label: 'Integrity Flags', value: flags, cls: 'violet' },
];
document.getElementById('stats').innerHTML = statData.map(s => `
  <div class="stat ${s.cls}">
    <div class="value">${esc(s.value)}</div>
    <div class="label">${esc(s.label)}</div>
  </div>
`).join('');

const notes = String(summary.notes || '').trim();
if (notes) {
  document.getElementById('insight').hidden = false;
  document.getElementById('insight-title').textContent = 'Search Demand vs. Editorial Urgency — Key Insight';
  document.getElementById('insight-copy').textContent = notes;
}

document.getElementById('priority-title').textContent =
  `Priority Topics — All ${candidates.length} Retained`;

const filters = ['All', 'P1', 'P2', 'P3', 'P4', 'P5'];
document.getElementById('filters').innerHTML = filters.map((f, i) =>
  `<button class="filter-btn ${i === 0 ? 'active' : ''}" data-filter="${f}">${f}</button>`
).join('');

function rowHtml(c, i) {
  const trend = clamp(c.trend_strength_score);
  const opp = clamp(c.opportunity_score);
  const vel = velocity(c);
  const velClass = vel >= 70 ? 'high' : vel >= 40 ? 'mid' : 'low';
  const sc = serpClass(c);
  const urgency = c.urgency || c.publish_timing || 'monitor';
  const labels = sourceLabels(c).map(label => `<span class="source-chip">${esc(label)}</span>`).join('');
  return `
    <tr class="topic-row" data-priority="${esc(c.priority_level)}" data-detail="${i}">
      <td class="rank">${String(i + 1).padStart(2, '0')}</td>
      <td>
        <div class="topic-title">${esc(c.topic)}</div>
        <div class="topic-sub">${esc(c.primary_headline || c.primary_entity || c.recommended_angle || '')}</div>
      </td>
      <td><span class="num">${trend}</span><span class="mini-bar trend"><span style="width:${trend}%"></span></span></td>
      <td><span class="num">${opp}</span><span class="mini-bar opp"><span style="width:${opp}%"></span></span></td>
      <td><span class="num velocity ${velClass}">${vel}</span></td>
      <td><span class="badge ${urgencyClass(urgency)}">${esc(urgency === 'this_week' ? 'today' : urgency)}</span></td>
      <td><span class="badge serp ${sc}">${serpLabel(sc)}</span></td>
      <td><span class="num">${esc(c.source_count ?? 0)}</span></td>
      <td>${labels}</td>
    </tr>
    <tr class="detail-row" data-parent="${i}" hidden>
      <td colspan="9">
        <div class="detail">
          <div><h4>Recommended Angle</h4><p>${esc(c.recommended_angle || 'No angle provided.')}</p></div>
          <div><h4>Why Now</h4><p>${esc(c.why_now || 'No timing rationale provided.')}</p></div>
          <div><h4>Next Steps</h4><p>${esc(c.next_steps || c.notes || 'No next steps provided.')}</p></div>
        </div>
      </td>
    </tr>
  `;
}

const tbody = document.getElementById('topic-rows');
tbody.innerHTML = candidates.map(rowHtml).join('');
document.getElementById('empty').hidden = candidates.length > 0;

tbody.addEventListener('click', event => {
  const row = event.target.closest('.topic-row');
  if (!row) return;
  const detail = tbody.querySelector(`.detail-row[data-parent="${row.dataset.detail}"]`);
  if (detail) detail.hidden = !detail.hidden;
});

document.getElementById('filters').addEventListener('click', event => {
  const btn = event.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filter = btn.dataset.filter;
  document.querySelectorAll('.topic-row').forEach(row => {
    const show = filter === 'All' || row.dataset.priority === filter;
    row.hidden = !show;
    const detail = tbody.querySelector(`.detail-row[data-parent="${row.dataset.detail}"]`);
    if (detail) {
      detail.hidden = true;
      detail.classList.toggle('hidden', !show);
    }
  });
});

if (rejected.length) {
  document.getElementById('rejected-section').hidden = false;
  document.getElementById('rejected-rows').innerHTML = rejected.map(r => `
    <tr><td>${esc(r.topic)}</td><td>${esc(r.reason)}</td></tr>
  `).join('');
}
</script>
</body>
